name: ShufflePlay
options:
  bundleIdPrefix: com.vitassun
  deploymentTarget:
    iOS: "16.0"
targets:
  ShufflePlay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShufflePlay
    info:
      path: ShufflePlay/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: ShufflePlay
        PRODUCT_BUNDLE_IDENTIFIER: com.vitassun.shuffleplay
        INFOPLIST_FILE: ShufflePlay/Resources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
